name: Relatar bug — Português (Brasil)
description: Conte o que deu errado. Não é necessário conhecimento técnico.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar um problema do WinSidebar 2.0. Não publique senhas, texto privado de snippets, caminhos confidenciais nem arquivos de perfil sem revisão.
  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Descreva o problema com suas próprias palavras.
      placeholder: Eu cliquei em..., depois...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste o menor conjunto de passos que faz o problema acontecer novamente.
      placeholder: |
        1. Abra o WinSidebar
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Versão do Windows
      options: [Windows 11, Windows 10, Não tenho certeza]
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Idioma do WinSidebar
      options: [English, Português (Brasil), Español, Русский, 简体中文, Não tenho certeza]
    validations:
      required: true
  - type: dropdown
    id: monitors
    attributes:
      label: Número de monitores
      options: ["1", "2", "3 ou mais", Não tenho certeza]
  - type: dropdown
    id: elevated
    attributes:
      label: Se for um problema de colagem, o aplicativo de destino estava aberto como administrador?
      options: ["Não", "Sim", Não tenho certeza, Não é um problema de colagem]
  - type: textarea
    id: exact-message
    attributes:
      label: Mensagem de erro exata, se houver
      description: Copie o texto se possível. Revise antes para remover informações privadas.
  - type: checkboxes
    id: privacy
    attributes:
      label: Verificação de privacidade
      options:
        - label: Revisei tudo o que colei ou enviei e removi senhas, texto confidencial e caminhos privados.
          required: true
