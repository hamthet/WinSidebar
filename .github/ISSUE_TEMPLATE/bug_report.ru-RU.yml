name: Сообщить об ошибке — Русский
description: Опишите, что пошло не так. Технические знания не требуются.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за сообщение о проблеме WinSidebar 2.0. Не публикуйте пароли, личный текст фрагментов, конфиденциальные пути и непроверенные файлы профиля.
  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло?
      description: Опишите проблему своими словами.
      placeholder: Я нажал..., затем...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Укажите минимальную последовательность действий, после которой проблема возникает снова.
      placeholder: |
        1. Откройте WinSidebar
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что вы ожидали?
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Версия Windows
      options: [Windows 11, Windows 10, Не уверен]
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Язык WinSidebar
      options: [English, Português (Brasil), Español, Русский, 简体中文, Не уверен]
    validations:
      required: true
  - type: dropdown
    id: monitors
    attributes:
      label: Количество мониторов
      options: ["1", "2", "3 или больше", Не уверен]
  - type: dropdown
    id: elevated
    attributes:
      label: Если проблема связана со вставкой, целевое приложение было запущено от имени администратора?
      options: ["Нет", "Да", Не уверен, Проблема не связана со вставкой]
  - type: textarea
    id: exact-message
    attributes:
      label: Точный текст ошибки, если он есть
      description: Скопируйте текст, если возможно. Сначала проверьте, нет ли в нём личной информации.
  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка конфиденциальности
      options:
        - label: Я проверил всё, что вставил или загрузил, и удалил пароли, конфиденциальный текст и частные пути.
          required: true
