name: Verify WinSidebar 2.0 portable build

# Manual only. The local verifier is the single release-build procedure.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run canonical WinSidebar 2.0 release verifier
        shell: powershell
        run: |
          .\tools\verify-release.ps1 -Dotnet dotnet -OutputRoot 'artifacts\release'

      - uses: actions/upload-artifact@v4
        with:
          name: WinSidebar-v2.0-win-x64
          path: artifacts/release/dist/
          if-no-files-found: error
