name: Verify runtime localization behavior
# Owner-directed local-only stage: no push or pull-request triggers.
# This workflow is NOT invoked while GitHub Actions billing is unavailable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locale-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify source keys and exact five-language parity
        shell: pwsh
        run: |
          @'
          import json, re
          from pathlib import Path
          base = json.loads(Path('i18n/catalog.json').read_text(encoding='utf-8'))
          keys = set()
          for path in (Path('src/WinSidebar.cs'), Path('src/ShortcutConfig.cs'), Path('src/WindowManagement.cs')):
              keys.update(re.findall(r'Localization\.Text\("([\w.]+)"\)', path.read_text(encoding='utf-8')))
          assert keys <= set(base), f'Undefined source keys: {sorted(keys-set(base))}'
          assert len(keys) >= 90, f'Unexpectedly low runtime coverage: {len(keys)}'
          for key, entry in base.items():
              assert set(entry) == {'en-US', 'pt-BR'}, key
              assert all(isinstance(value, str) and value.strip() for value in entry.values()), key
          for code in ('es-ES', 'ru-RU', 'zh-CN'):
              translations = json.loads((Path('i18n') / f'{code}.json').read_text(encoding='utf-8'))
              assert set(translations) == set(base), f'{code} catalog key mismatch: {sorted(set(translations)^set(base))}'
              assert all(isinstance(value, str) and value.strip() for value in translations.values()), code
          print(f'PASS: {len(keys)} referenced keys; {len(base)} fully populated entries in all five languages')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Locale source parity audit failed.' }
      - name: Exercise embedded catalog and locale-selection behavior
        shell: pwsh
        run: |
          dotnet run --project tests/LocalizationSmoke.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Runtime locale smoke test failed.' }
      - name: Compile complete WinForms program
        shell: pwsh
        run: |
          dotnet build WinSidebar.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'WinSidebar compile failed.' }
