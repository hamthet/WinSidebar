name: Render localized concept artwork

# Manual only. This workflow never writes back to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit concept-art disclosure and privacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('assets/hero-illustration.svg'), Path('assets/linkedin-illustration.svg')]
          files += sorted(Path('assets/i18n').glob('*/*.svg'))
          if len(files) != 10:
              raise SystemExit(f'Expected 10 localized SVG assets, found {len(files)}')

          forbidden = [
              r'(?i)C:[\\/]',
              r'(?i)[A-Z]:[\\/](?:git|h)[\\/]',
              r'(?i)[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}'
          ]
          expected_languages = {
              Path('assets/hero-illustration.svg'): 'en-US',
              Path('assets/linkedin-illustration.svg'): 'en-US',
              Path('assets/i18n/pt-BR/hero-illustration.svg'): 'pt-BR',
              Path('assets/i18n/pt-BR/linkedin-illustration.svg'): 'pt-BR',
              Path('assets/i18n/es-ES/hero-illustration.svg'): 'es-ES',
              Path('assets/i18n/es-ES/linkedin-illustration.svg'): 'es-ES',
              Path('assets/i18n/ru-RU/hero-illustration.svg'): 'ru-RU',
              Path('assets/i18n/ru-RU/linkedin-illustration.svg'): 'ru-RU',
              Path('assets/i18n/zh-CN/hero-illustration.svg'): 'zh-CN',
              Path('assets/i18n/zh-CN/linkedin-illustration.svg'): 'zh-CN',
          }
          english_accessibility = {}
          for source in (Path('assets/hero-illustration.svg'), Path('assets/linkedin-illustration.svg')):
              text = source.read_text(encoding='utf-8')
              title = re.search(r'<title id="title">([^<]+)</title>', text)
              desc = re.search(r'<desc id="desc">([^<]+)</desc>', text)
              if not title or not desc:
                  raise SystemExit(f'Missing English accessibility text: {source}')
              english_accessibility[source.name] = (title.group(1), desc.group(1))

          import json
          base_catalog = json.loads(Path('i18n/catalog.json').read_text(encoding='utf-8'))
          additional_catalogs = {
              code: json.loads((Path('i18n') / f'{code}.json').read_text(encoding='utf-8'))
              for code in ('es-ES', 'ru-RU', 'zh-CN')
          }
          default_keys = ('defaults.documents', 'defaults.downloads', 'defaults.archive', 'defaults.website')

          def localized_value(code, key):
              if code in ('en-US', 'pt-BR'):
                  return base_catalog[key][code]
              return additional_catalogs[code][key]

          for file in files:
              text = file.read_text(encoding='utf-8')
              if text.count('CONCEPT_ART_NOT_SCREENSHOT') != 1:
                  raise SystemExit(f'Concept-art marker count mismatch: {file}')
              if 'aria-labelledby="title desc"' not in text:
                  raise SystemExit(f'Missing SVG accessibility relationship: {file}')
              language = expected_languages[file]
              if f'xml:lang="{language}"' not in text:
                  raise SystemExit(f'SVG language metadata mismatch: {file}')
              title = re.search(r'<title id="title">([^<]+)</title>', text)
              desc = re.search(r'<desc id="desc">([^<]+)</desc>', text)
              if not title or not desc:
                  raise SystemExit(f'Missing SVG accessibility text: {file}')
              if language != 'en-US':
                  english_title, english_desc = english_accessibility[file.name]
                  if title.group(1) == english_title or desc.group(1) == english_desc:
                      raise SystemExit(f'Localized SVG accessibility text still matches English: {file}')
              for key in default_keys:
                  label = localized_value(language, key)
                  if f'>{label}</text>' not in text:
                      raise SystemExit(f'Concept artwork default shortcut label mismatch: {file} / {key}')
              shortcut_heading = localized_value(language, 'sidebar.shortcuts').strip()
              if f'>{shortcut_heading}' not in text:
                  raise SystemExit(f'Concept artwork shortcut heading mismatch: {file}')
              if 'AltGr+Y' not in text:
                  raise SystemExit(f'Concept artwork is missing the current sidebar hotkey: {file}')
              for pattern in forbidden:
                  if re.search(pattern, text):
                      raise SystemExit(f'Blocked possible personal content in {file}: {pattern}')
          print('PASS: localized concept-art disclosure/privacy/accessibility audit')
          PY

      - name: Render SVGs to PNG
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          sources = [Path('assets/hero-illustration.svg'), Path('assets/linkedin-illustration.svg')]
          sources += sorted(Path('assets/i18n').glob('*/*.svg'))
          out = Path('rendered')
          for source in sources:
              target = out / source.with_suffix('.png')
              target.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(url=str(source), write_to=str(target))
              if target.stat().st_size < 20000:
                  raise SystemExit(f'PNG unexpectedly small: {target}')
              print(target)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: WinSidebar-2.0-localized-artwork
          path: rendered/
          if-no-files-found: error
