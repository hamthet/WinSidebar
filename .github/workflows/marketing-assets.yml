name: Render localized concept artwork

# Manual only. This workflow never writes back to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit concept-art disclosure and privacy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('assets/hero-illustration.svg'), Path('assets/linkedin-illustration.svg')]
          files += sorted(Path('assets/i18n').glob('*/*.svg'))
          if len(files) != 10:
              raise SystemExit(f'Expected 10 localized SVG assets, found {len(files)}')

          forbidden = [
              r'(?i)C:[\\/]',
              r'(?i)[A-Z]:[\\/](?:git|h)[\\/]',
              r'(?i)[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}'
          ]
          for file in files:
              text = file.read_text(encoding='utf-8')
              if 'CONCEPT_ART_NOT_SCREENSHOT' not in text:
                  raise SystemExit(f'Missing concept-art marker: {file}')
              for pattern in forbidden:
                  if re.search(pattern, text):
                      raise SystemExit(f'Blocked possible personal content in {file}: {pattern}')
          print('PASS: localized concept-art disclosure/privacy audit')
          PY

      - name: Render SVGs to PNG
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          sources = [Path('assets/hero-illustration.svg'), Path('assets/linkedin-illustration.svg')]
          sources += sorted(Path('assets/i18n').glob('*/*.svg'))
          out = Path('rendered')
          for source in sources:
              target = out / source.with_suffix('.png')
              target.parent.mkdir(parents=True, exist_ok=True)
              cairosvg.svg2png(url=str(source), write_to=str(target))
              if target.stat().st_size < 20000:
                  raise SystemExit(f'PNG unexpectedly small: {target}')
              print(target)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: WinSidebar-2.0-localized-artwork
          path: rendered/
          if-no-files-found: error
