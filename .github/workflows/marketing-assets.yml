name: Render illustrative marketing artwork
on:
  push:
    branches: [main]
    paths:
      - 'assets/hero-ilustrativo.svg'
      - 'assets/linkedin-ilustrativo.svg'
      - '.github/workflows/marketing-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check that illustrations contain no personal example data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for file in [Path('assets/hero-ilustrativo.svg'), Path('assets/linkedin-ilustrativo.svg')]:
              text = file.read_text(encoding='utf-8')
              forbidden = [r'(?i)hamilton', r'(?i)econet', r'(?i)revmt', r'(?i)barra[lL]ateral', r'(?i)C:[\\/]', r'(?i)[A-Z]:[\\/]git', r'(?i)[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}']
              for pattern in forbidden:
                  if re.search(pattern, text):
                      raise SystemExit(f'Blocked: possible personal content in {file.name} ({pattern})')
              if 'ILUSTRATIVA' not in text.upper() or '98' not in text:
                  raise SystemExit(f'Missing disclosure in {file.name}')
          print('Marketing artwork privacy and disclosure checks passed.')
          PY
      - name: Render SVG to PNG on GitHub runner
        run: |
          python -m pip install --disable-pip-version-check 'CairoSVG==2.8.2'
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for stem in ['hero-ilustrativo', 'linkedin-ilustrativo']:
              source = Path('assets') / (stem + '.svg')
              target = Path('assets') / (stem + '.png')
              cairosvg.svg2png(url=str(source), write_to=str(target))
              if target.stat().st_size < 20000:
                  raise SystemExit(f'PNG unexpectedly small: {target}')
              print(f'{target}: {target.stat().st_size:,} bytes')
          PY
      - name: Publish generated PNG assets to this repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/hero-ilustrativo.png assets/linkedin-ilustrativo.png
          if git diff --cached --quiet; then
            echo 'PNG assets already up to date.'
            exit 0
          fi
          git commit -m 'Render public illustrative hero and LinkedIn PNG assets'
          git push origin HEAD:main
