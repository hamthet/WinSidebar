name: Validate English runtime localization development patch
on:
  push:
    branches: [feature/runtime-i18n-en]
    paths:
      - 'development/apply-runtime-i18n-en.py'
      - 'i18n/catalog.json'
      - 'src/Localization.cs'
      - '.github/workflows/runtime-i18n-en.yml'
      - WinSidebar.csproj
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check embedded locale catalog and apply anchored source integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import json; from pathlib import Path; c=json.loads(Path('i18n/catalog.json').read_text(encoding='utf-8')); assert all(set(v)=={'en-US','pt-BR'} and all(isinstance(s,str) and s.strip() for s in v.values()) for v in c.values()); print('English and Portuguese catalog entries:',len(c))"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid locale catalog.' }
          python development/apply-runtime-i18n-en.py
          if ($LASTEXITCODE -ne 0) { throw 'Anchored localization integration failed.' }
      - name: Publish Windows self-contained EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish WinSidebar.csproj -c Release -r win-x64 --self-contained true -o publish
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed.' }
          $output = @(Get-ChildItem publish -File)
          if ($output.Count -ne 1 -or $output[0].Name -ne 'WinSidebar.exe' -or $output[0].Length -lt 10000000) { throw 'Expected one self-contained EXE.' }
      - name: Commit verified implementation on feature branch only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/WinSidebar.cs src/ShortcutConfig.cs src/WindowManagement.cs development/i18n-untranslated-candidates.txt
          if (git diff --cached --quiet) { throw 'No integrated source changes.' }
          git commit -m 'feat(i18n): wire English and Portuguese runtime language selection'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:feature/runtime-i18n-en
          if ($LASTEXITCODE -ne 0) { throw 'Push failed.' }
