<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">WinSidebar: window management with an intentional Windows 98 look</title>
<desc id="desc">Concept illustration, not a screenshot: a generic dual-monitor desktop, a collapsible sidebar, and sample shortcuts. It does not reproduce the application interface exactly.</desc>
